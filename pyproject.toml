[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobbot"
version = "0.1.0"
description = "Hands off job intake: LinkedIn alert emails, public career boards, and self hosted web search into one ready queue"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "APScheduler>=3.10,<4",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "anthropic>=0.39",
    "openai>=1.40",
    "tzdata>=2024.1",
    "pypdf>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
jobbot = "jobbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobbot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
